<!DOCTYPE html>
<!-- HTML5 문서 선언 -->
<html lang="en">
<!-- 문서 시작 -->
<head>
  <meta charset="UTF-8">
  <!-- 문자 인코딩 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 반응형 대응 -->
  <title>pixel_editor_answer.html</title>
  <!-- 탭 제목 -->
</head>
<body>
  <h1>PIXEL EDITOR</h1>
  <!-- 제목 -->
  <div id="editor"></div>
  <!-- 에디터 전체 영역 -->
  <script>
    function makeElement(name, attributes){
      // HTML 요소 생성 유틸 함수
      const node = document.createElement(name);

      if(attributes){
        for(const key in attributes){
          node.setAttribute(key, attributes[key]);
        }
      }
      return node;
    }

    function createPixelEditor(target, nx, ny){
      // 픽셀 에디터 생성 함수
      const $colorInput = makeElement('input', { type: 'color' });
      // 색상 선택기
      target.append($colorInput);
      const $clearBtn = makeElement('input', { type: 'button', value: 'Clear' });
      // 전체 초기화 버튼
      target.append($clearBtn);

      const $table = makeElement('table');
      // 픽셀용 테이블
      target.append($table);
      $table.style.borderCollapse = 'collapse';
      $table.style.marginTop = '10px';

      for(let y=0; y<ny; y++){
        // 행 생성
        const $tr = makeElement('tr');
        $table.append($tr);

        for(let x=0; x<nx; x++){
          // 칸 생성
          const $td = makeElement('td');
          $tr.append($td);

          $td.style.width = '15px';
          $td.style.height = '15px';
          $td.style.border = '1px solid gray';

          $td.addEventListener('click', ()=>{
            // 칸 클릭 시 색칠
            $td.style.backgroundColor = $colorInput.value;
          });
        }
      }

      $clearBtn.addEventListener('click', ()=>{
        // Clear 버튼 클릭 시 전체 초기화
        const cells = $table.querySelectorAll('td');
        cells.forEach(td => td.style.backgroundColor = '');
      });
    }

    const $editor = document.querySelector('#editor');
    // editor 영역 선택
    createPixelEditor($editor, 20, 20);
    // 20x20 픽셀 에디터 생성
  </script>
</body>
</html>

### ✅ 요구 사항

1. `makeElement` 같은 **유틸 함수**를 사용해서 DOM 요소를 생성할 것
2. `createPixelBoard(target, nx, ny)` 함수를 만들 것
3. 함수 실행 시

   * `nx × ny` 크기의 테이블이 생성되어야 함
4. 각 칸(`td`)을 클릭하면

   * **현재 선택된 색상으로 칠해질 것**
5. 상단에

   * 색상 선택 input (`type="color"`)
   * Clear 버튼 (`type="button"`)  가 있어야 함
6. Clear 버튼을 누르면

   * 모든 칸 색상이 초기화될 것

### 💡 힌트 (안 보고 풀어도 됨)
